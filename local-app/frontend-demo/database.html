<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixffice · SQLite 저장 확인</title><style>body{font:15px/1.6 system-ui;margin:0;background:#f5f6f0;color:#243c32}main{max-width:1150px;margin:36px auto;padding:24px}a{color:#31624e}button{padding:10px 18px;background:#315d4c;color:white;border:0;border-radius:8px;cursor:pointer}section{background:white;padding:24px;margin:20px 0;border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid #dde5df;vertical-align:top}pre{white-space:pre-wrap;max-width:850px;font:14px/1.7 system-ui}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:white;border-radius:12px;padding:15px 24px}.card b{display:block;font-size:26px}small{color:#607267}summary{cursor:pointer;color:#315d4c}h1{margin:10px 0}#error{color:#a53232}</style><main><a href="/#tasks">← 업무 보드</a><h1>SQLite 저장 확인</h1><p>로컬 DB를 직접 조회한 결과입니다. 이 화면에서는 데이터를 변경하지 않습니다.</p><button id="reload">다시 조회</button> <span id="time"></span><p id="error" role="status"></p><div class="cards" id="counts"></div><div id="tables"></div></main><script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={proposal_briefs:'제안서 생성 근거',proposal_versions:'제안서 원고 버전',order_schedule_changes:'발주 일정 변경 이력',materials_catalog:'자재·단가',operation_documents:'견적·공정·발주 문서',operation_reviews:'견적·공정·발주 승인 이력',ai_employees:'AI 직원',role_instructions:'역할지시서 버전',business_rules:'업무기준 버전',projects:'고객·현장',portfolios:'시공 사례',media_files:'파일 메타데이터',tasks:'업무와 AI 원고',approvals:'작업 승인·반려 기록',channel_posts:'채널별 게시물',channel_post_reviews:'채널별 승인·반려 기록',post_rewrites:'AI 재작성 이력'};
async function load(){document.querySelector('#reload').disabled=true;try{const r=await fetch('/api/database');if(!r.ok)throw Error('DB 조회 실패');const d=await r.json();document.querySelector('#time').textContent='조회: '+new Date(d.queried_at).toLocaleString('ko-KR');document.querySelector('#counts').innerHTML=Object.entries(d.tables).map(([k,v])=>`<div class="card">${esc(names[k])}<b>${v.count}건</b></div>`).join('');document.querySelector('#tables').innerHTML=Object.entries(d.tables).map(([k,v])=>{const columns=v.rows.length?Object.keys(v.rows[0]):[];return `<section><h2>${esc(names[k])} <small>${esc(k)} · ${v.count}건</small></h2>${!columns.length?'<p>저장된 기록이 없습니다.</p>':`<table><thead><tr>${columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${v.rows.map(row=>`<tr>${columns.map(c=>`<td>${c==='result'||String(row[c]||'').length>150?`<details><summary>내용 펼치기 (${String(row[c]||'').length}자)</summary><pre>${esc(row[c])}</pre></details>`:esc(row[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}<small>최신 최대 100건 표시</small></section>`}).join('');document.querySelector('#error').textContent='';}catch(e){document.querySelector('#error').textContent=e.message;}finally{document.querySelector('#reload').disabled=false;}}
document.querySelector('#reload').onclick=load;load();</script></html>
